<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glide library</title>
<link rel="icon" href="icons/32.png" />
<link rel="stylesheet" href="ui.css" />
</head>
<body class="library">
<header class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>Glide</div>
  <p id="status" role="status" aria-live="polite">Loading…</p>
  <button id="refresh" type="button" class="btn ghost">Refresh</button>
</header>

<main class="lib-main" aria-label="Recordings">
  <ul id="list" class="lib-list"></ul>
  <div id="empty" class="empty" hidden><div class="empty-card"><strong>No recordings yet</strong><p>Record from the Glide toolbar button — finished takes land here and open in the editor.</p></div></div>
</main>

<footer class="credit">Based on <a href="https://github.com/webadderallorg/Recordly" target="_blank" rel="noopener">Recordly</a> (AGPL-3.0) · Glide is AGPL-3.0 · <a href="https://github.com/lizliz404/glide" target="_blank" rel="noopener">Source</a></footer>
<script type="module" src="library.js"></script>
</body>
</html>
