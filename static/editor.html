<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glide editor</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body class="editor">
<header class="bar">
  <strong class="brand">Glide</strong>
  <p id="status" role="status" aria-live="polite">Loading…</p>
  <label class="btn ghost">Open files<input id="open-files" type="file" accept="video/*,.json" multiple hidden /></label>
</header>
<main class="layout">
  <section class="preview" aria-label="Preview">
    <div class="stage-wrap"><canvas id="stage" width="1920" height="1080" aria-label="Composited video preview"></canvas>
      <div id="empty" class="empty" hidden><p>No recording loaded. Record from the Glide toolbar button, or use <b>Open files</b> (screen video, optional webcam video with “cam” in its name, optional events JSON).</p></div>
    </div>
    <div class="transport">
      <button id="play" type="button" class="btn" aria-pressed="false">Play</button>
      <input id="scrub" type="range" min="0" max="1" step="1" value="0" aria-label="Seek" />
      <span id="time" class="mono">0:00.0 / 0:00.0</span>
    </div>
    <div id="timeline" class="timeline" aria-label="Zoom segments (blue) and clicks (white ticks)"></div>
    <p class="hint"><span id="seg-count"></span> · Space to play/pause</p>
  </section>
  <aside class="panel" aria-label="Settings">
    <fieldset><legend>Canvas</legend>
      <label>Aspect <select id="aspect"><option>16:9</option><option>9:16</option><option>4:3</option><option>3:4</option><option>1:1</option></select></label>
      <div class="row"><span>Background</span><div id="swatches" class="swatches"></div></div>
      <label>Solid color <input id="bg-color" type="color" value="#111827" /></label>
      <label>Image <input id="bg-image" type="file" accept="image/*" /></label>
      <label>Padding <input id="padding" type="range" min="0" max="0.2" step="0.005" /><output for="padding"></output></label>
      <label>Corner radius <input id="radius" type="range" min="0" max="48" step="1" /><output for="radius"></output></label>
      <label>Shadow <input id="shadow" type="range" min="0" max="1" step="0.05" /><output for="shadow"></output></label>
    </fieldset>
    <fieldset><legend>Zoom</legend>
      <label class="check"><input id="zoom-on" type="checkbox" /> Auto-zoom on clicks</label>
      <label>Scale <input id="zoom-scale" type="range" min="1.2" max="3" step="0.1" /><output for="zoom-scale"></output></label>
      <label class="check"><input id="zoom-follow" type="checkbox" /> Follow cursor while zoomed</label>
      <label>Trigger <select id="zoom-clicks"><option value="1">every click</option><option value="2">2 clicks within 3s</option></select></label>
      <label>Hold after click <input id="zoom-hold" type="range" min="400" max="4000" step="100" /><output for="zoom-hold"></output></label>
    </fieldset>
    <fieldset><legend>Cursor</legend>
      <label class="check"><input id="cursor-draw" type="checkbox" /> Draw smooth cursor</label>
      <label>Size <input id="cursor-size" type="range" min="0.6" max="2" step="0.1" /><output for="cursor-size"></output></label>
      <label>Smoothing <input id="cursor-smooth" type="range" min="0" max="2" step="0.1" /><output for="cursor-smooth"></output></label>
      <label class="check"><input id="cursor-ripple" type="checkbox" /> Click ripple</label>
    </fieldset>
    <fieldset><legend>Webcam</legend>
      <label class="check"><input id="cam-show" type="checkbox" /> Show webcam</label>
      <label>Size <input id="cam-size" type="range" min="0.1" max="0.45" step="0.01" /><output for="cam-size"></output></label>
      <label>Corner <select id="cam-corner"><option value="br">bottom right</option><option value="bl">bottom left</option><option value="tr">top right</option><option value="tl">top left</option></select></label>
      <label>Shape <select id="cam-shape"><option value="circle">circle</option><option value="rounded">rounded square</option></select></label>
      <label class="check"><input id="cam-mirror" type="checkbox" /> Mirror</label>
    </fieldset>
    <div class="export">
      <button id="export-mp4" type="button" class="btn primary">Export MP4</button>
      <button id="export-webm" type="button" class="btn">Export WebM</button>
      <button id="cancel" type="button" class="btn ghost" hidden>Cancel</button>
      <progress id="progress" max="1" value="0" hidden aria-label="Export progress"></progress>
    </div>
  </aside>
</main>
<script type="module" src="editor.js"></script>
</body>
</html>
